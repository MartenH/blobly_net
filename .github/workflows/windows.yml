name: windows-build

# Native Windows build of the Blobly Net GUI (the Dear ImGui app, cmd/blobly_net).
# Compiles + links + bundles it; does NOT run it. The mingw job builds and stages; the bundle
# job adds canbridge (built on Linux beside it) and publishes. The old vlang/gui app
# (src/main.v) and its MSVC/vcpkg/pango/vglyph path were retired when the migration landed.
#
# Status: VALIDATED ON THE RUNNER. The imgui Windows build (build_deps.sh + the `#flag windows`
# link line in libs/vgui/vgui.v) is green here and has been for a long run of builds — this job
# is what the README points people at for a prebuilt bundle, so treat a failure as a release
# blocker, not as an expected flake. (It was marked best-effort/unvalidated while the imgui
# migration settled; that is no longer true.)
# If a link lib ever goes missing, add the matching mingw-w64-ucrt-x86_64-* package to the MSYS2
# install list below.
#
# MSYS2 environment: UCRT64. MINGW64 is deprecated by MSYS2, and the two link different C runtimes
# (UCRT / msvcrt), so the compiler, the ImGui archive and every bundled DLL come from UCRT64 alone;
# libs/vgui/build_deps.sh stamps which toolchain built the archive and run_gui.sh rebuilds a
# mismatch. GCC either way: CLANG64 would also change the compiler and the C++ library.
#
# V acquisition: DOWNLOAD the prebuilt V from this repo's "v-toolchain" release (V's makev.bat
# self-compile hangs on the runner). It is the V3 of .v-version, cross-built from Linux by
# scripts/mint_windows_v.sh for exactly C:\v-ct, and drives mingw gcc via -cc gcc.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # release.yml reuses this build — ONE build recipe, not a copy that drifts
    inputs:
      publish_bundle:
        # The upload gate below trusts THIS input, never a ref shape: a workflow_dispatch
        # can be pointed at any tag, so "the ref is a v* tag" proves nothing about review
        # status. Only release.yml sets it, and only after its guard job has proven the
        # tagged commit is reachable from origin/main.
        type: boolean
        default: false

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  V_RELEASE: v-toolchain            # release storing the prebuilt V asset
  V_ASSET: v-0535623-windows.zip    # scripts/mint_windows_v.sh at .v-version; re-mint when it moves
  # a V3 failure must fail, not be rebuilt by a downloaded V1 (ci.yml says why)
  V_MACOS_V3_NO_FALLBACK: 1
  V_C_ERROR_BUG_REPORT_DISABLED: 1
  # V3's module cache, on by default since ea5156d, makes every compile here SLOWER on a runner
  # that starts with it empty (measured: a test 9.0 -> 2.5 s, an image's transpile 38 -> 25 s)
  VFLAGS: -nocache
  # V3's test runner allows one parallel job per 8 GB, so a 16 GB runner tests on one or two of
  # its four cores; a compile here peaks near 1 GB
  VJOBS: 4

jobs:
  # THE BUNDLE CARRIES A LINUX PROGRAM (#451): canbridge, which the Windows app starts inside a WSL
  # distribution through wsl.exe to reach its vcans. It is a Linux ELF, so it is built on Linux —
  # on 22.04, the oldest supported glibc, for the reason release.yml's AppImage is — and handed to
  # the bundle job below as a short-lived artifact, never published on its own. Built IN PARALLEL
  # with the mingw job, not ahead of it: a cold V cache makes this job the long one.
  canbridge-linux:
    name: canbridge (Linux, for the WSL bridge)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up pinned V (cached)
        uses: ./.github/actions/setup-v
      - name: Build canbridge
        run: |
          v -enable-globals -o canbridge cmd/canbridge
          ./canbridge --help
      - uses: actions/upload-artifact@v7
        with:
          name: canbridge-linux
          path: canbridge
          retention-days: 1
          if-no-files-found: error

  build-msys2:
    name: mingw (MSYS2) • GUI bundle
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Download prebuilt V (0535623)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:V_RELEASE --repo "$env:GITHUB_REPOSITORY" --pattern "$env:V_ASSET" --dir "$env:RUNNER_TEMP"
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\$env:V_ASSET" -DestinationPath C:\v-ct -Force
          if (-not (Test-Path C:\v-ct\v.exe)) { throw "v.exe not found after extracting $env:V_ASSET" }
          & C:\v-ct\v.exe version

      # UCRT64 toolchain + the imgui link deps (mirror the `#flag windows` line in vgui.v):
      # gcc/g++ (build_deps.sh), glfw (windowing), freetype/harfbuzz/glib2/fribidi/fontconfig
      # (glyph rasterizer + text stack), git (build_deps clones cimgui/cimplot).
      - name: Set up MSYS2 (UCRT64 gcc + glfw + freetype)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-glfw
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-fribidi
            mingw-w64-ucrt-x86_64-fontconfig

      - name: Build GUI dependencies (cached)
        uses: ./.github/actions/gui-deps
        with:
          shell: msys2 {0}

      # Build cmd/blobly_net through scripts/run_gui.sh — the SAME script developers run and the
      # Linux job (ci.yml) already calls, so this recipe cannot drift from theirs. It once did:
      # this job knew the build needs vlang/markdown and the script did not, so a local Windows
      # build failed on `cannot import module "markdown"` while CI stayed green. (markdown is
      # now vendored in libs/markdown, so there is nothing to fetch and nothing to pin twice.)
      # Only the CI-specific inputs are passed in: V= the prebuilt toolchain (no sibling ../v
      # on a runner) and NO_PARALLEL=1 (this runner builds serially).
      # RUN=0 = build only; V appends .exe, so the output is build/blobly_net.exe — the product
      # name. It was blobly_vgui.exe until the app was renamed cmd/blobly_vgui -> cmd/blobly_net;
      # "vgui" is the internal ImGui wrapper (libs/vgui, which keeps that name), not something a
      # user should ever see. That mismatch was a live bug: scripts/register_blobnet_win.ps1 has
      # always searched for blobly_net.exe, so .blobnet file association could never find the
      # executable it was written for.
      # Same sweep as the Linux job, from the Windows toolchain: a tool that checks on one
      # runner and not the other is exactly what the per-platform backend split can produce.
      - name: Every cmd/ tool type-checks, both targets (scripts/check_cmds.sh)
        shell: msys2 {0}
        run: V=/c/v-ct/v.exe sh scripts/check_cmds.sh

      # THE PLATFORM BRANCH ONLY THIS RUNNER CAN EXECUTE. isotp.open dispatches at compile time
      # (kernel socket on Linux, software channel elsewhere), so the Ubuntu job compiles the
      # Linux half and the test of the other half passes there without calling anything (codex
      # round 1 on #225). One module, seconds; the full suite stays the Linux job's.
      - name: Module tests that dispatch per platform (v test blobly/isotp/)
        shell: msys2 {0}
        run: /c/v-ct/v.exe -cc gcc -enable-globals test blobly/isotp/

      # blobly.dll, the C ABI (cmd/libblobly), driven by the C smoke here and by the runner's own
      # Python below; the ucrt64 runtime it links lands beside it, as the exe's does, so a host
      # outside the msys2 shell can load it.
      - name: libblobly (blobly.dll) + C smoke
        shell: msys2 {0}
        run: |
          V=/c/v-ct/v.exe sh scripts/build_libblobly.sh build
          ldd build/blobly.dll | awk '/\/ucrt64\/bin\// {print $3}' | sort -u \
            | while read -r d; do cp -f "$d" build/; done
          gcc -Wall -o build/bb_smoke.exe cmd/libblobly/smoke.c
          build/bb_smoke.exe build/blobly.dll projects/sim-demo.blobnet
      - name: libblobly ctypes smoke (Windows Python)
        shell: pwsh
        run: python -I cmd/libblobly/smoke.py build/blobly.dll projects/sim-demo.blobnet

      - name: Build the GUI app (RUN=0 scripts/run_gui.sh)
        shell: msys2 {0}
        run: |
          RUN=0 NO_PARALLEL=1 V=/c/v-ct/v.exe sh scripts/run_gui.sh
          test -f build/blobly_net.exe && echo "BUILD OK -> build/blobly_net.exe"
          # Copy the exe's ucrt64 runtime DLLs (freetype/harfbuzz/glib/gcc/…) next to it via
          # ldd, so the bundled artifact runs outside an MSYS2 shell.
          ldd build/blobly_net.exe | awk '/\/ucrt64\/bin\// {print $3}' | sort -u \
            | while read -r d; do cp -f "$d" build/; done
          echo "bundled $(ls build/*.dll 2>/dev/null | wc -l) ucrt64 DLLs"

      # Stage the demo projects/DBCs/samples + the ldd-resolved runtime DLLs next to the exe,
      # so the artifact runs on a clean machine.
      # The payload list lives in scripts/stage_bundle.sh — ONE list for this zip and the
      # Linux tar.gz, so the two archives cannot drift (and it fails hard on a missing
      # file instead of shipping thin). Only the platform extras stage here: the exe, its
      # mingw runtime DLLs, and the file-association script.
      - name: Stage bundle
      # msys2 shell so the SAME sh script serves both platforms. bash rather than sh: the DLL
      # licence sweep below uses an array and nullglob.
        shell: msys2 {0}
        run: |
          mkdir -p dist
          ver="$(sed -n "s/^\s*version: '\(.*\)'\s*$/\1/p" v.mod)"
          V=/c/v-ct/v.exe sh scripts/stage_bundle.sh dist "$ver"
          cp build/blobly_net.exe dist/blobly_net.exe
          cp build/blobly.dll dist/blobly.dll   # the C ABI (cmd/libblobly); its header is in include/
          # The scripts canbridge's "no vcan module" failure tells the user to run in WSL from
          # this folder; canbridge itself joins in the bundle job.
          mkdir -p dist/scripts
          cp scripts/setup_vcan.sh scripts/build_vcan_module.sh scripts/vcan_common.sh \
            scripts/setup_sudoers.sh dist/scripts/
          # The bare -static is gone (#318), so the freetype chain resolves to DLLs and the ldd
          # sweep above copies them here. `find` rather than `cp build/*.dll` is still right:
          # GLFW and the GCC runtime stay static by explicit flag, so the set is small and could
          # in principle be empty, and a bare glob fails the whole release when it matches
          # nothing (codex #137 r2, P1).
          find build -maxdepth 1 -name '*.dll' -exec cp {} dist/ \;
          # THE BUNDLED DLLs' OWN LICENCES, DERIVED FROM WHAT IS ACTUALLY THERE (#318). Every
          # missing notice this branch found was found one at a time, against a list somebody
          # maintained by hand — so this one is not a list. It asks pacman which package owns
          # each DLL that ldd put here and copies that package's licence directory, which is
          # where GLib's and FriBidi's LGPL-2.1 text comes from: bundling an LGPL library
          # requires its licence to accompany the distribution, and that text is nowhere in
          # this repo.
          #
          # FAILS LOUD. A DLL whose licence cannot be resolved stops the build rather than
          # shipping unlicensed, which is the lesson of the V-licence bug on this same branch:
          # a check that falls back to something plausible is worse than no check.
          shopt -s nullglob
          dlls=(dist/*.dll)
          [ "${#dlls[@]}" -gt 0 ] || { echo "no DLLs bundled — the freetype chain linked statically after all, see libs/vgui/vgui.v"; exit 1; }
          mkdir -p dist/licenses
          for dll in "${dlls[@]}"; do
            base="$(basename "$dll")"
            # ours (cmd/libblobly): under this repo's LICENSE, not an MSYS2 package's
            [ "$base" = blobly.dll ] && continue
            pkg="$(pacman -Qoq "/ucrt64/bin/$base" 2>/dev/null || true)"
            [ -n "$pkg" ] || { echo "no owning package for $base"; exit 1; }
            lic="/ucrt64/share/licenses/${pkg#mingw-w64-ucrt-x86_64-}"
            [ -d "$lic" ] || { echo "no licence directory for $pkg ($base)"; exit 1; }
            mkdir -p "dist/licenses/${pkg#mingw-w64-ucrt-x86_64-}"
            cp -r "$lic/." "dist/licenses/${pkg#mingw-w64-ucrt-x86_64-}/"
          done
          echo "staged licences for ${#dlls[@]} bundled DLL(s)"

          # register_blobnet_win.ps1 resolves the exe "next to THIS script" first, and
          # says the bundle stages it alongside — it once did not, so .blobnet association
          # was unreachable for exactly the users it was written for. Stage it.
          cp scripts/register_blobnet_win.ps1 dist/register_blobnet_win.ps1

      # Handed to the bundle job, which adds canbridge — only where one is published.
      - name: Hand the staged bundle on
        if: github.ref == 'refs/heads/main' || inputs.publish_bundle == true
        uses: actions/upload-artifact@v7
        with:
          name: windows-staged
          path: dist
          retention-days: 1
          if-no-files-found: error

  bundle:
    name: Windows bundle (+ canbridge)
    needs: [canbridge-linux, build-msys2]
    # the gate the upload below states, so a PR pays for no artifact round trip
    if: github.ref == 'refs/heads/main' || inputs.publish_bundle == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-staged
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: canbridge-linux
          path: canbridge-linux
      # Beside the exe, where transport.bridge_launch_wsl looks for it (#451).
      - name: Add canbridge
        run: |
          test -f dist/blobly_net.exe
          cp canbridge-linux/canbridge dist/canbridge

      # Publishes from reviewed history ONLY: a push to main, or a call from release.yml
      # carrying publish_bundle=true — which it sets only after its guard proves the
      # tagged commit is reachable from origin/main. PR runs and manual dispatches (from
      # any ref, tags included — a dispatch can be pointed at an arbitrary tag, so a ref
      # -shape test proves nothing) compile-validate and publish nothing; handing users an
      # executable nobody reviewed is the failure this gate exists for (codex net#62/#63,
      # tightened by the release self-review).
      - name: Upload bundle
        if: github.ref == 'refs/heads/main' || inputs.publish_bundle == true
        uses: actions/upload-artifact@v7
        with:
          name: blobly_net-windows-x64
          path: dist
          if-no-files-found: error
