name: windows-build

# Native Windows build of CANTester in CI (MSVC + vcpkg). Compiles + links the full
# GUI app; does NOT run it (headless runner). Local equivalents:
# scripts\build_win_msvc.ps1 (MSVC), scripts\build_win.ps1 (mingw).
#
# V acquisition: we DOWNLOAD a pre-built V (de365a1) from this repo's "v-toolchain"
# release instead of building it. Why: there is no prebuilt V from de365a1's era
# (newest release 0.5.1/March predates the vlib/yaml modules/project needs), and V's
# makev.bat self-compile (which leans on the vlang/tccbin prebuilt tcc) HANGS on the
# runner regardless of disk/compiler (tcc/clang/gcc all wedge — TinyCC's own CI builds
# with MSVC for the same reason). So we ship the known-good V binary and reuse it.
#
# ONE-TIME SETUP (maintainer): create a release tagged `v-toolchain` and attach
# `v-de365a1-windows.zip` (a zip of a working V de365a1 install — v.exe + vlib at the
# zip root; produced locally from C:\dev\v minus .git). Update the V_RELEASE/ASSET
# below if you re-mint it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  V_RELEASE: v-toolchain
  V_ASSET: v-de365a1-windows.zip

jobs:
  build-msvc:
    runs-on: windows-latest
    timeout-minutes: 60   # cold run builds vcpkg pango/freetype from source (~30-40 min); cached after
    env:
      VMODULES: ${{ github.workspace }}\vmodules
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
    steps:
      - uses: actions/checkout@v4

      - name: Download prebuilt V (de365a1)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:V_RELEASE --repo "$env:GITHUB_REPOSITORY" --pattern "$env:V_ASSET" --dir "$env:RUNNER_TEMP"
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\$env:V_ASSET" -DestinationPath C:\v-ct -Force
          if (-not (Test-Path C:\v-ct\v.exe)) { throw "v.exe not found after extracting $env:V_ASSET" }
          "C:\v-ct" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii
          & C:\v-ct\v.exe version

      - name: Install gui + vglyph (pinned) and apply the W1 patches
        shell: pwsh
        run: |
          $vm = $env:VMODULES
          New-Item -ItemType Directory -Force $vm | Out-Null
          # core.autocrlf=false so the working trees stay LF and the LF patches apply.
          git -c core.autocrlf=false clone --quiet https://github.com/vlang/gui.git    "$vm\gui"
          git -C "$vm\gui"    -c advice.detachedHead=false checkout --quiet 68b9302
          git -c core.autocrlf=false clone --quiet https://github.com/vlang/vglyph.git "$vm\vglyph"
          git -C "$vm\vglyph" -c advice.detachedHead=false checkout --quiet 5685a6d
          $patches = @(
            @{ Repo = 'gui';    File = '01-gui-readback-cobjmacros.patch' },
            @{ Repo = 'gui';    File = '02-gui-dialog-includes.patch'     },
            @{ Repo = 'gui';    File = '03-gui-titlebar-isvalid.patch'    },
            @{ Repo = 'vglyph'; File = '04-vglyph-empty-outline.patch'    }
          )
          foreach ($p in $patches) {
            $patch = "$env:GITHUB_WORKSPACE\scripts\win_patches\$($p.File)"
            git -C "$vm\$($p.Repo)" apply --ignore-whitespace $patch
            if ($LASTEXITCODE -ne 0) { throw "patch $($p.File) failed to apply to $($p.Repo)" }
            Write-Host "applied $($p.File)"
          }

      - name: Set up MSVC (cl.exe on PATH)
        uses: ilammy/msvc-dev-cmd@v1

      # The runner's vcpkg builds pango/freetype FROM SOURCE (not warm-cached on the
      # image). Persist its binary archives so the cold build is paid once.
      - name: Cache vcpkg binaries (pango/freetype)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-bincache
          key: vcpkg-x64-windows-pango-freetype-v1

      - name: vcpkg install pango freetype
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          vcpkg install pango freetype --triplet x64-windows

      - name: Build (V -cc msvc + vcpkg)
        shell: pwsh
        run: |
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          $env:PKG_CONFIG_PATH = "$vcpkg\lib\pkgconfig"   # V's v.pkgconfig reads this
          New-Item -ItemType Directory -Force build | Out-Null
          # -enable-globals: main.v uses the in-proc bus (transport/inproc.v __global).
          v -cc msvc -no-parallel -enable-globals -path "@vlib|@vmodules|modules" `
            -cflags "/I`"$vcpkg\include`"" -ldflags "/LIBPATH:`"$vcpkg\lib`"" `
            -o build\cantester-msvc.exe src\main.v
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          Write-Host "BUILD OK -> build\cantester-msvc.exe"

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: cantester-msvc-x64
          path: build/cantester-msvc.exe
          if-no-files-found: error
