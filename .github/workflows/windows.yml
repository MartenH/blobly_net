name: windows-build

# Native Windows build of the Blobly Net GUI (the Dear ImGui app, cmd/blobly_net).
# Compiles + links + bundles it; does NOT run it. One job (mingw); the old vlang/gui app
# (src/main.v) and its MSVC/vcpkg/pango/vglyph path were retired when the migration landed.
#
# Status: VALIDATED ON THE RUNNER. The imgui Windows build (build_deps.sh + the `#flag windows`
# link line in libs/vgui/vgui.v) is green here and has been for a long run of builds — this job
# is what the README points people at for a prebuilt bundle, so treat a failure as a release
# blocker, not as an expected flake. (It was marked best-effort/unvalidated while the imgui
# migration settled; that is no longer true.)
# If a link lib ever goes missing, add the matching mingw-w64-x86_64-* package to the MSYS2
# install list below.
#
# V acquisition: DOWNLOAD the prebuilt master V from this repo's "v-toolchain" release
# (V's makev.bat self-compile hangs on the runner). It just drives mingw gcc via -cc gcc.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # release.yml reuses this build — ONE build recipe, not a copy that drifts
    inputs:
      publish_bundle:
        # The upload gate below trusts THIS input, never a ref shape: a workflow_dispatch
        # can be pointed at any tag, so "the ref is a v* tag" proves nothing about review
        # status. Only release.yml sets it, and only after its guard job has proven the
        # tagged commit is reachable from origin/main.
        type: boolean
        default: false

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  V_RELEASE: v-toolchain            # release storing the prebuilt V asset
  V_ASSET: v-ddc9c99-windows.zip    # prebuilt master V (has vlib/yaml + -enable-globals)

jobs:
  build-msys2:
    name: mingw (MSYS2) • GUI bundle
    runs-on: windows-latest
    timeout-minutes: 60

    # @vmodules resolves here (the Windows v.exe reads $VMODULES); vlang/markdown is cloned into it
    # below for the Help browser view. A Windows-style path the msys2 steps convert with cygpath.
    env:
      VMODULES: ${{ github.workspace }}\vmodules

    steps:
      - uses: actions/checkout@v4

      - name: Download prebuilt master V (ddc9c99)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:V_RELEASE --repo "$env:GITHUB_REPOSITORY" --pattern "$env:V_ASSET" --dir "$env:RUNNER_TEMP"
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\$env:V_ASSET" -DestinationPath C:\v-ct -Force
          if (-not (Test-Path C:\v-ct\v.exe)) { throw "v.exe not found after extracting $env:V_ASSET" }
          & C:\v-ct\v.exe version

      # mingw toolchain + the imgui link deps (mirror the `#flag windows` line in vgui.v):
      # gcc/g++ (build_deps.sh), glfw (windowing), freetype/harfbuzz/glib2/fribidi/fontconfig
      # (glyph rasterizer + text stack), git (build_deps clones cimgui/cimplot).
      - name: Set up MSYS2 (mingw-w64 gcc + glfw + freetype)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-glfw
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-harfbuzz
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-fribidi
            mingw-w64-x86_64-fontconfig

      # imgui + ImPlot + GLFW + FreeType C deps -> libs/vgui/libvgui_c.a (g++). build_deps.sh
      # runs unmodified on MSYS2 (git + g++). It's gitignored, so always built fresh.
      - name: Build imgui C deps (libs/vgui/libvgui_c.a)
        shell: msys2 {0}
        run: sh libs/vgui/build_deps.sh

      # vlang/markdown (md4c) — the Help "Open in browser" view. Cloned into $VMODULES (the same
      # dir the Windows v.exe reads via @vmodules); md4c-lib.o auto-builds from its sibling .c
      # under mingw gcc. Pinned to a known-good commit.
      - name: Fetch vlang/markdown (Help browser view)
        shell: msys2 {0}
        run: |
          vm="$(cygpath -u "$VMODULES")"
          mkdir -p "$vm"
          git -c advice.detachedHead=false clone --quiet https://github.com/vlang/markdown.git "$vm/markdown"
          git -C "$vm/markdown" -c advice.detachedHead=false checkout --quiet ef2f101

      # Build cmd/blobly_net. The prebuilt v.exe drives mingw gcc via -cc gcc; the
      # `#flag windows` line in vgui.v carries the static glfw + freetype/harfbuzz/glib link
      # line. -path adds `libs` for the `vgui` module. (The old app needed a 2-step V->C->gcc
      # workaround for a V/os.execute panic; the mingw src/main.v job built with the one-liner
      # fine, so we use it here too — switch to build_deps.sh's 2-step if it regresses.)
      # The binary is blobly_net.exe — the product name. It was blobly_vgui.exe until the app
      # was renamed cmd/blobly_vgui -> cmd/blobly_net; "vgui" is the internal ImGui wrapper
      # (libs/vgui, which keeps that name), not something a user should ever see. That mismatch
      # was a live bug: scripts/register_blobnet_win.ps1 has always searched for blobly_net.exe,
      # so .blobnet file association could never find the executable it was written for.
      - name: Build the GUI app (V -cc gcc)
        shell: msys2 {0}
        run: |
          mkdir -p build
          /c/v-ct/v.exe -cc gcc -no-parallel -enable-globals -path '@vlib|@vmodules|modules|libs' \
            -o build/blobly_net.exe cmd/blobly_net/
          test -f build/blobly_net.exe && echo "BUILD OK -> build/blobly_net.exe"
          # Copy the exe's mingw64 runtime DLLs (freetype/harfbuzz/glib/gcc/…) next to it via
          # ldd, so the bundled artifact runs outside an MSYS2 shell.
          ldd build/blobly_net.exe | awk '/\/mingw64\/bin\// {print $3}' | sort -u \
            | while read -r d; do cp -f "$d" build/; done
          echo "bundled $(ls build/*.dll 2>/dev/null | wc -l) mingw64 DLLs"

      # Stage the demo projects/DBCs/samples + the ldd-resolved runtime DLLs next to the exe,
      # so the artifact runs on a clean machine.
      # The payload list lives in scripts/stage_bundle.sh — ONE list for this zip and the
      # Linux tar.gz, so the two archives cannot drift (and it fails hard on a missing
      # file instead of shipping thin). Only the platform extras stage here: the exe, its
      # mingw runtime DLLs, and the file-association script.
      - name: Stage bundle
      # msys2 shell so the SAME sh script serves both platforms
        shell: msys2 {0}
        run: |
          mkdir -p dist
          ver="$(sed -n "s/^\s*version: '\(.*\)'\s*$/\1/p" v.mod)"
          sh scripts/stage_bundle.sh dist "$ver"
          cp build/blobly_net.exe dist/blobly_net.exe
          cp build/*.dll dist/
          # register_blobnet_win.ps1 resolves the exe "next to THIS script" first, and
          # says the bundle stages it alongside — it once did not, so .blobnet association
          # was unreachable for exactly the users it was written for. Stage it.
          cp scripts/register_blobnet_win.ps1 dist/register_blobnet_win.ps1

      # Publishes from reviewed history ONLY: a push to main, or a call from release.yml
      # carrying publish_bundle=true — which it sets only after its guard proves the
      # tagged commit is reachable from origin/main. PR runs and manual dispatches (from
      # any ref, tags included — a dispatch can be pointed at an arbitrary tag, so a ref
      # -shape test proves nothing) compile-validate and publish nothing; handing users an
      # executable nobody reviewed is the failure this gate exists for (codex net#62/#63,
      # tightened by the release self-review).
      - name: Upload bundle
        if: github.ref == 'refs/heads/main' || inputs.publish_bundle == true
        uses: actions/upload-artifact@v4
        with:
          name: blobly_net-windows-x64
          path: dist
          if-no-files-found: error
