name: ci

# Linux CI for Blobly Net. The backbone runs as parallel jobs, because its time is compiling
# (the unit suite alone was 18 CPU-minutes of compile on a four-core runner, in one job):
#   * unit       — `v -enable-globals test` over every GUI-free module (incl. the embedded-Lua
#                  `lua`/`script` modules), in parts (scripts/unit_tests.sh --shard)
#   * abi        — libblobly, the engine as a shared library, from C and Python, and the
#                  Python package over it
#   * checks     — every cmd/ tool type-checked, the scripts' own tests, and the headless Lua
#                  integration tests (scripts/runtests.sh) against the in-process sim
#   * test       — the verdict over those three, under the name protect-main requires
#                  No GUI, no vcan, no Windows — fast and deterministic.
#   * gui-build — compile-links the Dear ImGui + ImPlot app (cmd/blobly_net): builds
#                  the imgui/ImPlot/GLFW/FreeType C deps into libs/vgui/libvgui_c.a, then
#                  compiles the V frontend against it. It does NOT run the app (no display).
#
# The GUI is the imgui frontend (cmd/blobly_net) — the old vlang/gui app (src/main.v)
# was retired when the migration landed, so there's no gui/vglyph to fetch here, and
# vlang/markdown is vendored in libs/markdown.
#
# V acquisition: built from source at the commit `.v-version` names, with the
# BOOTSTRAP pinned by `.vc-version` (a master V — the in-process bus and the vendored Lua
# need a current toolchain; the 0.5.1 *release* predates vlib/yaml which blobly/project
# uses). Two pins, not one, and the second is the whole reason this is hand-rolled rather
# than `vlang/setup-v` — see the note at the install step.
#
# V_MACOS_V3_NO_FALLBACK=1, for every `v` in every job. The toolchain is V3, and when V3 cannot
# build a program a V3 `v` silently RETRIES with a downloaded V1 compiler — so without this a
# V3 regression would pass CI on the old compiler and nobody would know. Despite the name it is
# read on every platform (vlang/v cmd/v/v.v).
#
# V_C_ERROR_BUG_REPORT_DISABLED, because V uploads a source excerpt on any C compilation error
# (`v help build-c`), and a PR that breaks the vendored Lua's #flag build would send this
# repository's source too. The env var is V's opt-out for every path that reports.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One in-flight run per ref; new pushes cancel the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# PINNED, not latest: `.v-version` names a V3 commit this repo is known to build and pass on
# (a master commit). One file, read by every job here,
# by release.yml's Linux job and by scripts/setup_env.sh, so the pin is stated once. Moving it is
# a decision, not a drift.
#
# `.vc-version` is the SECOND half of that pin and is not optional. Pinning the V source while
# `make` clones vlang/vc unpinned is not a pin at all: the day vc regenerated from V3 master
# (2026-09-07 05:31 UTC) every Linux job on every branch died in `make` with nothing in the repo
# changed. vc is regenerated about once a day, so it rarely holds the C generated from the exact
# `.v-version`: pin the newest vc at or before it, and prove the pair with a build
# (`v_toolchain_install` from scripts/v_toolchain.sh) before committing either file.
env:
  V_MACOS_V3_NO_FALLBACK: 1
  V_C_ERROR_BUG_REPORT_DISABLED: 1
  # V3's module cache, on by default since ea5156d, makes every compile here SLOWER on a runner
  # that starts with it empty (measured: a test 9.0 -> 2.5 s, an image's transpile 38 -> 25 s)
  VFLAGS: -nocache
  # V3's test runner allows one parallel job per 8 GB, so a 16 GB runner tests on one or two of
  # its four cores; a compile here peaks near 1 GB
  VJOBS: 4

jobs:
  # All GUI-free modules, in parts run side by side: whole module folders balanced by test count
  # (scripts/unit_shard.sh), so V's own discovery still picks the test files in each. The part
  # count is the matrix's length and stated nowhere else. -enable-globals: the in-process bus
  # (transport/inproc.v) uses a process-global hub. The vendored Lua compiles in here too
  # (blobly/lua + blobly/script pull it via #flag).
  unit:
    name: linux • unit tests ${{ matrix.part }}/${{ strategy.job-total }}
    runs-on: ubuntu-24.04 # the release floor (release.yml linux)
    strategy:
      # every part reports, so one failure does not hide another part's
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - name: Set up pinned V (cached)
        uses: ./.github/actions/setup-v
      - name: Unit tests (scripts/unit_tests.sh --shard)
        run: ./scripts/unit_tests.sh --shard ${{ matrix.part }}/${{ strategy.job-total }}

  abi:
    name: linux • libblobly C ABI + Python
    runs-on: ubuntu-24.04 # the release floor (release.yml linux)
    steps:
      - uses: actions/checkout@v7
      - name: Set up pinned V (cached)
        uses: ./.github/actions/setup-v

      # The engine as a shared library with a C ABI (cmd/libblobly, bb.h): built -O1 -shared,
      # then driven by a C host and by a ctypes host — each on a thread of the HOST's own as
      # well, with enough allocation on it to collect there, since a thread the collector did
      # not see born is the one way an embedded V runtime differs from a program.
      - name: libblobly C ABI smokes (cmd/libblobly)
        run: |
          sh scripts/build_libblobly.sh build
          gcc -Wall -o build/bb_smoke cmd/libblobly/smoke.c -ldl -lpthread
          build/bb_smoke build/libblobly.so projects/sim-demo.blobnet
          python3 -I cmd/libblobly/smoke.py build/libblobly.so projects/sim-demo.blobnet
      # The Python package over that library (python/blobly): its event loop's model and the
      # package against sim-demo. BLOBLY_LIB set, so a missing library fails rather than skips.
      - name: Python package (python/blobly)
        run: BLOBLY_LIB=build/libblobly.so python3 -I -m unittest discover -s python/tests -t python -v
      # The wheel PyPI gets (scripts/build_wheel.py): built from the library above, its platform tag
      # checked by auditwheel, installed into a fresh venv, and the package's tests run against the
      # INSTALLED copy — -I and -t python/tests keep the source tree off sys.path, and
      # TestInstalledWheel asserts that the package and the library it loaded are the wheel's.
      # From the repository root, which the step's own paths (build/, scripts/, python/tests) name.
      - name: Python wheel (built, installed, tested)
        run: |
          python3 -m venv "$RUNNER_TEMP/wheeltools"
          "$RUNNER_TEMP/wheeltools/bin/pip" install -q wheel auditwheel
          "$RUNNER_TEMP/wheeltools/bin/python" scripts/build_wheel.py --native build/libblobly.so --out build/wheels
          "$RUNNER_TEMP/wheeltools/bin/auditwheel" show build/wheels/*.whl
          python3 -m venv "$RUNNER_TEMP/wheeltest"
          "$RUNNER_TEMP/wheeltest/bin/pip" install -q build/wheels/*.whl
          BLOBLY_TEST_INSTALLED=1 "$RUNNER_TEMP/wheeltest/bin/python" -I -m unittest discover -s python/tests -t python/tests -v

  checks:
    name: linux • cmd checks, script tests + headless Lua
    runs-on: ubuntu-24.04 # the release floor (release.yml linux)
    steps:
      - uses: actions/checkout@v7

      - name: Set up pinned V (cached)
        uses: ./.github/actions/setup-v

      - name: V version
        run: v version

      # release.yml refuses a tag the highlights do not name; asked here against v.mod, so a
      # version bump without its highlights fails on the PR, not after the tag is pushed
      - name: Release highlights name v.mod's version
        run: |
          ver="$(sed -n "s/^\s*version: '\(.*\)'\s*\$/\1/p" v.mod)"
          first="$(sed -n 1p packaging/RELEASE_HIGHLIGHTS.md)"
          [ "$first" = "<!-- v$ver -->" ] \
            || { echo "packaging/RELEASE_HIGHLIGHTS.md starts '$first', not '<!-- v$ver -->' — write the highlights with the bump"; exit 1; }

      # The unit suite's parts cover every module folder exactly once, for any part count: a
      # folder in no part is a suite that silently stops running.
      - name: unit-suite parts (scripts/unit_shard_test.sh)
        run: ./scripts/unit_shard_test.sh
      - name: GUI-local rules (scripts/test_cmd_rules.sh)
        # GUI policy with a test: pure V, no ImGui, so it runs where the GUI cannot — from a copy
        # outside the repository, so a rule package that imports a blobly module fails here.
        run: ./scripts/test_cmd_rules.sh

      # EVERY cmd/ tool type-checks, for both OS targets. Nothing else here compiles a CLI
      # tool, so a rename in blobly/ could break any of them and the build stayed green: #217
      # retired a helper and broke cmd/vectorcheck, and two smoke tools sat broken on Windows
      # for months (#220). -check needs no C compiler and no GLFW, so this costs under a minute.
      - name: Every cmd/ tool type-checks, both targets (scripts/check_cmds.sh)
        run: |
          chmod +x scripts/check_cmds.sh
          ./scripts/check_cmds.sh

      # The shared answers behind setup_vcan.sh / build_vcan_module.sh. Pure functions of the
      # environment (whose home under sudo, is vcan available, may we even ask), driven through
      # stubbed getent/id/ip/sudo so they run unprivileged here. net#122 spent four review rounds
      # on two bugs these cover, and the CLAUDE.md rule for a repeating path is to cover it.
      - name: vcan shared-answer tests (scripts/vcan_common_test.sh)
        run: |
          chmod +x scripts/vcan_common_test.sh
          ./scripts/vcan_common_test.sh

      # When the pinned V toolchain is rebuilt, and what counts as evidence it WAS built. Same
      # reason as the suite above: #285 found one shape three rounds running — a check on the
      # state of the inputs standing in for "this was successfully built" — and the regression
      # it pins is `make fails -> the next run must still rebuild`, which every earlier version
      # of that predicate got wrong. Stubbed git/make, so it runs anywhere.
      - name: V toolchain pin tests (scripts/v_toolchain_test.sh)
        run: |
          chmod +x scripts/v_toolchain_test.sh
          ./scripts/v_toolchain_test.sh

      # What check_cmds.sh's mut-alias scan calls a COPY under V3 (`ap := app` in a mut method)
      # and what it must not (`&app`, `unsafe { app }`, a nested fn's pointer parameter, a
      # `// copy:` snapshot). The copy it guards against crashed the CAN diagnostic press.
      - name: mut-alias scan fixtures (scripts/mut_alias_test.sh)
        run: |
          chmod +x scripts/mut_alias_test.sh
          ./scripts/mut_alias_test.sh

      # The @codex review watcher has to read GitHub JSON from every verdict channel, match by
      # reviewed SHA, and preserve gh API failures instead of reporting "nothing waiting". The
      # fixtures pin those behaviours so future review rounds do not depend on hand polling.
      - name: codex review watcher tests (scripts/codex_review_watch_test.sh)
        run: |
          chmod +x scripts/codex_review_watch_test.sh
          python3 -m py_compile scripts/codex_review.py
          ./scripts/codex_review_watch_test.sh
      # Which codex the local review runs: the first candidate that actually runs, never an empty or
      # broken one (an interrupted extension update once left a 0-byte copy, which failed the review
      # as "codex wrote no final message" with no cause named). Through --check-codex: no git, no net.
      - name: codex local review binary tests (scripts/codex_local_review_test.sh)
        run: bash scripts/codex_local_review_test.sh

      # End-to-end: brings the sim-demo project's simulated ECUs + native UDS
      # server up driver-free on the in-proc bus and runs the Lua test scripts.
      # Non-zero exit on any failing test (the script enforces it).
      - name: Headless Lua tests (scripts/runtests.sh)
        run: |
          chmod +x scripts/runtests.sh
          # EVERY suite in tests/, because that is what no arguments means. It used to name each
          # file and each file's project here, which made a new suite invisible to CI until
          # somebody remembered to add it — the gap #115 was filed for.
          #
          # The suites that need a particular project now declare it themselves
          # (`-- @project`, see blobly/script/project_decl.v), so this list cannot drift out of
          # step with what the tests actually require, and the runner refuses a project that
          # contradicts a declaration rather than reporting it as failing tests.
          ./scripts/runtests.sh

  # THE REQUIRED CHECK. The protect-main ruleset requires a check of this name, so the jobs
  # above report under it here: it passes only if every one of them passed. Renaming it, or
  # dropping it, leaves every PR waiting on a check that never reports. always(), never
  # !cancelled(): a skipped required check counts as PASSING, so a cancelled run must fail here.
  test:
    name: linux • modules + headless Lua
    needs: [unit, abi, checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$NEEDS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

  gui-build:
    name: linux • GUI (imgui) compile-link
    runs-on: ubuntu-24.04 # the release floor (release.yml linux)
    steps:
      - uses: actions/checkout@v7

      - name: Set up pinned V (cached)
        uses: ./.github/actions/setup-v

      # cmd/blobly_net links against the imgui C deps: g++ builds them, GLFW is the
      # windowing backend (its X11 deps come in transitively), FreeType is the glyph
      # rasterizer, mesa provides libGL. No V-module deps to fetch: vlang/markdown (the Help
      # browser view) is vendored in libs/markdown, which is already on -path.
      - name: Native deps (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ pkg-config libglfw3-dev libfreetype-dev libgl1-mesa-dev

      - name: Build GUI dependencies (cached)
        uses: ./.github/actions/gui-deps

      # scripts/run_gui.sh (RUN=0 = build only) reuses the validated libvgui_c.a and compiles
      # cmd/blobly_net with the right flags (-cc gcc -enable-globals -path …|libs). Using
      # the same script devs use keeps CI and local builds identical.
      - name: Build GUI app (RUN=0 scripts/run_gui.sh)
        run: |
          RUN=0 sh scripts/run_gui.sh
          test -x build/blobly_net && echo "BUILD OK -> build/blobly_net"

      # THE BINARY THIS JOB ALREADY BUILT, kept instead of discarded. windows.yml has published
      # its bundle on every main push for a long time while the Linux job built the same app and
      # threw it away, so the only Linux binary anyone could download came from cutting a tag —
      # which is a poor answer for "I want to try what just landed", and a worse one for anyone
      # whose local V cannot link the GUI (the pin in .v-version is not always what a dev has).
      #
      # ON main ONLY, the gate windows.yml already uses and for its reason: handing out an
      # executable nobody reviewed is what that gate exists to prevent (codex net#62/#63). A
      # branch build stays a compile check.
      #
      # TARRED, AND WITH THE NOTICES, for two reasons that both bite the person downloading it:
      #
      #   * upload-artifact rewrites every file it stores to mode 0644 (its own README documents
      #     this and recommends an archive). Uploaded bare, the binary this job advertises fails
      #     with "Permission denied" the moment someone runs ./blobly_net. A tar carries the
      #     mode through, and GitHub's zip wrapper around it does not touch what is inside.
      #   * AN ACTIONS ARTIFACT ON A PUBLIC REPO IS A DISTRIBUTION. The app statically carries
      #     vendored Lua and markdown, whose MIT terms require the copyright and permission
      #     notices to travel with copies (packaging/THIRD-PARTY-NOTICES.txt). The release
      #     tarball has always included them; a binary handed out without them is the same
      #     distribution minus the one file that makes it lawful.
      #
      # This is NOT the release bundle: no projects, DBCs, samples or docs. Just the executable
      # and the notices it may not travel without.
      - name: Stage the Linux binary + notices (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          # A TOP-LEVEL DIRECTORY, as the release tarball has. Unpacked from a populated
          # directory — Downloads, which is where this lands — a tar of `.` spills the binary,
          # LICENSE.txt and licenses/ loose into it and can overwrite an unrelated LICENSE.txt
          # already sitting there (codex round 4).
          top=blobly_net-linux-x64
          mkdir -p "dist-ci/$top/licenses"
          cp build/blobly_net "dist-ci/$top/"
          cp LICENSE "dist-ci/$top/LICENSE.txt"
          cp packaging/THIRD-PARTY-NOTICES.txt "dist-ci/$top/"
          # THE NOTICES FILE IS AN INDEX, NOT THE NOTICES. It lists components and links and
          # says so itself ("full licence texts are available from each project"), while MIT
          # requires the copyright and permission notices to accompany copies of what is
          # statically incorporated (codex round 3). These are the texts this build can prove
          # it has; see #318 for the complete audit, which is a maintainer call because it
          # turns on static-vs-dynamic linking per platform.
          lic="dist-ci/$top/licenses"
          cp thirdparty/lua/LICENSE          "$lic/lua-LICENSE.txt"
          cp libs/markdown/LICENSE           "$lic/vlang-markdown-LICENSE.txt"
          cp libs/vgui/build/cimgui/imgui/LICENSE.txt "$lic/dear-imgui-LICENSE.txt"
          cp libs/vgui/build/cimgui/LICENSE  "$lic/cimgui-LICENSE.txt"
          cp libs/vgui/build/cimplot/implot/LICENSE "$lic/implot-LICENSE.txt"
          cp libs/vgui/build/cimplot/LICENSE "$lic/cimplot-LICENSE.txt"
          # V's standard library is MIT and compiled in, and its text is NOT in this repo — it
          # comes from the toolchain this job installed, which is the only place a build can
          # honestly get it (codex round 4).
          vroot="$(dirname "$(readlink -f "$(command -v v)")")"
          cp "$vroot/LICENSE" "$lic/v-stdlib-LICENSE.txt"
          for f in lua vlang-markdown dear-imgui cimgui implot cimplot v-stdlib; do
            test -s "$lic/$f-LICENSE.txt" || { echo "licence text missing: $f"; exit 1; }
          done
          tar -C dist-ci -czf blobly_net-linux-x64.tar.gz "$top"
          tar -tvzf blobly_net-linux-x64.tar.gz | grep -q "rwx.*$top/blobly_net\$" \
            || { echo 'the binary lost its executable bit'; exit 1; }

      # HANDED TO THE PUBLISH JOB, not published from here. This job compiles; it does not know
      # whether the engine tests passed, because `test` runs beside it. Uploading the advertised
      # name here attaches a downloadable application to a run whose tests may have failed
      # (codex round 2). The name below says what it is, and it expires in a day.
      - name: Hand the archive to the publish job (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: linux-build-unvalidated
          path: blobly_net-linux-x64.tar.gz
          retention-days: 1
          if-no-files-found: error

      # libs/vgui is a standalone module, and this is what proves it: trace_chart imports only
      # `os` + `vgui`, so it compiles with no app module reachable. libs/vgui has its own v.mod,
      # which roots its imports there, and the repository root is not on the path, so a stray
      # `import blobly.x` fails (checked on both compilers). If the binding ever grows a dependency
      # on app code, this breaks and the app build does not. Reuses libvgui_c.a from the step
      # above, so it costs seconds.
      - name: vgui builds standalone (no app on the path)
        run: |
          v -cc gcc -path "@vlib|libs|@vmodules" -o /tmp/vgui_standalone \
            libs/vgui/examples/trace_chart/trace_chart.v
          test -x /tmp/vgui_standalone && echo "OK — vgui has no app dependency"

  # THE ONE STEP THAT HANDS SOMEBODY A BINARY, and the only one gated on the WHOLE verdict:
  # `needs` the build and the tests' verdict, so a main push whose engine tests failed publishes
  # nothing. It exists as its own job rather than a `needs: test` on gui-build because that would
  # serialise every PR behind the tests to gate an artifact only main pushes ever produce.
  # Re-uploading a staged archive costs seconds and leaves the builds parallel.
  #
  # Residual, stated rather than hidden: `linux-build-unvalidated` from the job above is
  # attached to a failed run too. It is named for what it is and expires in a day; the
  # advertised name, the one the README sends people to, only ever appears on a green run.
  publish-linux:
    name: linux • publish binary (main only)
    if: github.ref == 'refs/heads/main'
    needs: [test, gui-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-build-unvalidated

      - name: Upload the Linux binary
        uses: actions/upload-artifact@v7
        with:
          name: blobly_net-linux-x64
          path: blobly_net-linux-x64.tar.gz
          if-no-files-found: error
