name: ci

# Linux CI for Blobly Net. Two jobs:
#   * test       — the reliable backbone: `v -enable-globals test modules/` (every GUI-free module,
#                  incl. the embedded-Lua `lua`/`script` modules) + the headless Lua
#                  integration tests (scripts/runtests.sh) against the in-process sim.
#                  No GUI, no vcan, no Windows — fast and deterministic.
#   * gui-build — compile-links the Dear ImGui + ImPlot app (cmd/blobly_net): builds
#                  the imgui/ImPlot/GLFW/FreeType C deps into libs/vgui/libvgui_c.a, then
#                  compiles the V frontend against it. It does NOT run the app (no display).
#
# The GUI is the imgui frontend (cmd/blobly_net) — the old vlang/gui app (src/main.v)
# was retired when the migration landed, so there's no gui/vglyph/markdown here anymore.
#
# V acquisition: vlang/setup-v with check-latest (master V — the in-process bus and the
# vendored Lua need a current toolchain; the 0.5.1 *release* predates vlib/yaml which
# modules/project uses).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One in-flight run per ref; new pushes cancel the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: linux • modules + headless Lua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install V (latest)
        uses: vlang/setup-v@v1.4
        with:
          check-latest: true

      - name: V version
        run: v version

      # All GUI-free modules. -enable-globals: the in-process bus
      # (transport/inproc.v) uses a process-global hub. The vendored Lua compiles
      # in here too (modules/lua + modules/script pull it via #flag).
      - name: Unit tests (v test modules/)
        run: v -enable-globals test modules/

      # End-to-end: brings the sim-demo project's simulated ECUs + native UDS
      # server up driver-free on the in-proc bus and runs the Lua test scripts.
      # Non-zero exit on any failing test (the script enforces it).
      - name: Headless Lua tests (scripts/runtests.sh)
        run: |
          chmod +x scripts/runtests.sh
          # Every suite is named explicitly — runtests.sh runs only what it is given, so a new
          # file is invisible to CI until it appears here. tests/fault_injection.lua covers the
          # script-to-simulation wiring and timed behaviour, which nothing else exercises.
          ./scripts/runtests.sh tests/diag_basic.lua tests/bus_signals.lua tests/diag_advanced.lua tests/sequences.lua tests/fault_injection.lua
          # DoIP needs its own project: the entity is an Ethernet endpoint, not a bus on
          # sim-demo, and it binds real localhost TCP/UDP 13400 while it runs.
          ./scripts/runtests.sh --project projects/doip-demo.blobnet tests/diag_doip.lua

  gui-build:
    name: linux • GUI (imgui) compile-link
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install V (latest)
        uses: vlang/setup-v@v1.4
        with:
          check-latest: true

      # cmd/blobly_net links against the imgui C deps: g++ builds them, GLFW is the
      # windowing backend (its X11 deps come in transitively), FreeType is the glyph
      # rasterizer, mesa provides libGL. No vlang/gui / vglyph — the imgui app doesn't
      # use them; the ONE V-module dep is vlang/markdown (Help browser view), cloned below.
      - name: Native deps (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ pkg-config libglfw3-dev libfreetype-dev libgl1-mesa-dev

      # vlang/markdown (md4c) — the Help panel's "Open in browser" renders the docs to HTML via
      # markdown.to_html(). md4c-lib.o auto-builds from its sibling .c on first compile, so a plain
      # clone into @vmodules is enough. Pinned to a known-good commit.
      - name: Fetch vlang/markdown (Help browser view)
        run: |
          git -c advice.detachedHead=false clone --quiet https://github.com/vlang/markdown.git "$HOME/.vmodules/markdown"
          git -C "$HOME/.vmodules/markdown" -c advice.detachedHead=false checkout --quiet ef2f101

      # scripts/run_gui.sh (RUN=0 = build only) builds libs/vgui/libvgui_c.a from the
      # pinned cimgui/cimplot (gitignored, so always built fresh) and then compiles
      # cmd/blobly_net with the right flags (-cc gcc -enable-globals -path …|libs). Using
      # the same script devs use keeps CI and local builds identical.
      - name: Build GUI app (RUN=0 scripts/run_gui.sh)
        run: |
          RUN=0 sh scripts/run_gui.sh
          test -x build/blobly_net && echo "BUILD OK -> build/blobly_net"

      # libs/vgui is a standalone module, and this is what proves it: trace_chart imports only
      # `os` + `vgui`, so it compiles WITHOUT modules/ on the path. If the binding ever grows a
      # dependency on app code, this breaks and the app build does not. Reuses libvgui_c.a from
      # the step above, so it costs seconds.
      - name: vgui builds standalone (no app on the path)
        run: |
          v -cc gcc -path "@vlib|@vmodules|libs" -o /tmp/vgui_standalone \
            libs/vgui/examples/trace_chart/trace_chart.v
          test -x /tmp/vgui_standalone && echo "OK — vgui has no app dependency"
