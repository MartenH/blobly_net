name: ci

# Linux CI for Blobly Net. Two jobs:
#   * test       — the reliable backbone: `v test modules/` (every GUI-free module,
#                  incl. the embedded-Lua `lua`/`script` modules) + the headless Lua
#                  integration tests (scripts/runtests.sh) against the in-process sim.
#                  No GUI, no vcan, no Windows — fast and deterministic.
#   * vgui-build — compile-links the Dear ImGui + ImPlot app (cmd/blobly_vgui): builds
#                  the imgui/ImPlot/GLFW/FreeType C deps into eval/vgui/libvgui_c.a, then
#                  compiles the V frontend against it. It does NOT run the app (no display).
#
# The GUI is the imgui frontend (cmd/blobly_vgui) — the old vlang/gui app (src/main.v)
# was retired when the migration landed, so there's no gui/vglyph/markdown here anymore.
#
# V acquisition: vlang/setup-v with check-latest (master V — the in-process bus and the
# vendored Lua need a current toolchain; the 0.5.1 *release* predates vlib/yaml which
# modules/project uses).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One in-flight run per ref; new pushes cancel the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: linux • modules + headless Lua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install V (latest)
        uses: vlang/setup-v@v1.4
        with:
          check-latest: true

      - name: V version
        run: v version

      # All GUI-free modules. -enable-globals: the in-process bus
      # (transport/inproc.v) uses a process-global hub. The vendored Lua compiles
      # in here too (modules/lua + modules/script pull it via #flag).
      - name: Unit tests (v test modules/)
        run: v -enable-globals test modules/

      # End-to-end: brings the sim-demo project's simulated ECUs + native UDS
      # server up driver-free on the in-proc bus and runs the Lua test scripts.
      # Non-zero exit on any failing test (the script enforces it).
      - name: Headless Lua tests (scripts/runtests.sh)
        run: |
          chmod +x scripts/runtests.sh
          ./scripts/runtests.sh tests/diag_basic.lua tests/bus_signals.lua

  vgui-build:
    name: linux • vgui (imgui) compile-link
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install V (latest)
        uses: vlang/setup-v@v1.4
        with:
          check-latest: true

      # cmd/blobly_vgui links against the imgui C deps: g++ builds them, GLFW is the
      # windowing backend (its X11 deps come in transitively), FreeType is the glyph
      # rasterizer, mesa provides libGL. No vlang/gui / vglyph / markdown — the imgui
      # app doesn't use them.
      - name: Native deps (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ pkg-config libglfw3-dev libfreetype-dev libgl1-mesa-dev

      # scripts/run_vgui.sh (RUN=0 = build only) builds eval/vgui/libvgui_c.a from the
      # pinned cimgui/cimplot (gitignored, so always built fresh) and then compiles
      # cmd/blobly_vgui with the right flags (-cc gcc -enable-globals -path …|eval). Using
      # the same script devs use keeps CI and local builds identical.
      - name: Build vgui app (RUN=0 scripts/run_vgui.sh)
        run: |
          RUN=0 sh scripts/run_vgui.sh
          test -x build/blobly_vgui && echo "BUILD OK -> build/blobly_vgui"
