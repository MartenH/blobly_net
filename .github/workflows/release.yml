# A release is cut by pushing a version tag: `git tag v0.1.0 && git push origin v0.1.0`.
#
# Two invariants, enforced rather than trusted:
#  - the tag must equal the version in v.mod — the repo's ONE version statement, which the
#    binary itself decodes into `--version` and the window title — and the Linux job then
#    asserts the BUILT BINARY answers with the tag (the Windows exe compiles the same
#    committed v.mod, so one execution covers both; that transitivity breaks the day the
#    version becomes build-injected, which is why it is written down here);
#  - the tagged commit must be reachable from origin/main, so a release can only come from
#    reviewed history. windows.yml publishes for a tag ONLY when this workflow calls it with
#    publish_bundle=true, behind that guard — never on the ref's say-so.
#
# The bundle payload list lives in scripts/stage_bundle.sh, shared with windows.yml — one
# list, two archives, no drift. NO vendor CAN library ships either way: vxlapi64.dll,
# PCANBasic.dll and canlib32.dll come with the vendor's driver installs, and the Vector XL
# terms forbid redistribution (ROADMAP: the one hard-to-take-back mistake).
#
# The release binary is the same non-optimized build every test and CI run exercises — on a
# beta compiler, shipping the binary everybody tested beats shipping a -prod profile nothing
# ever ran. Revisit when CI itself builds -prod — and read the FIRST entry in
# docs/known_issues.md before you do: -prod plus a Boehm GC mode makes every call out of a frame
# holding a pointerful array by value cost O(len), which took a 1.23M-frame replay from real
# time to about thirteen days (~17,000x). Nothing here builds -prod today, which is the only
# reason we are clear; cmd/restbus is fixed, the GUI's replay_group is not. Upstream fixed the
# compiler in vlang/v#28426, which the V3 pin in .v-version now contains; the repro has not been
# re-run on it yet.
name: release

on:
  push:
    tags: ['v[0-9]*'] # not plain v*: the v-toolchain tag (prebuilt V for CI) must not fire this

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# read-only by default: the called Windows build compiles third-party sources (cimgui,
# vlang/markdown) and must not hold a token that can write releases. Only publish gets write.
permissions:
  contents: read

# as ci.yml: a V3 failure must fail the release, not be rebuilt by a downloaded V1 compiler
env:
  V_MACOS_V3_NO_FALLBACK: 1
  V_C_ERROR_BUG_REPORT_DISABLED: 1
  # as ci.yml, where the reasons are
  VFLAGS: -nocache
  VJOBS: 4

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      # full history: merge-base needs origin/main, and checkout at depth 0 fetches all
      # branch heads even on a tag ref
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: tag equals v.mod and sits on main
        run: |
          ver="$(sed -n "s/^\s*version: '\(.*\)'\s*\$/\1/p" v.mod)"
          [ -n "$ver" ] || { echo "could not parse version from v.mod — its format changed?"; exit 1; }
          [ "v$ver" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != v.mod v$ver"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "tagged commit is not on origin/main — releases come from reviewed history only"; exit 1; }
      # the highlights are written for ONE release: a file still naming the previous tag would
      # publish last release's summary above this release's changelog
      - name: the highlights name this tag
        run: |
          first="$(sed -n 1p packaging/RELEASE_HIGHLIGHTS.md)"
          [ "$first" = "<!-- $GITHUB_REF_NAME -->" ] \
            || { echo "packaging/RELEASE_HIGHLIGHTS.md starts '$first', not '<!-- $GITHUB_REF_NAME -->' — write this release's highlights"; exit 1; }

  windows:
    needs: guard
    uses: ./.github/workflows/windows.yml
    with:
      publish_bundle: true # only ever set here, behind the guard above

  linux:
    needs: guard
    # PINNED, NOT FLOATING, and the AppImage is why. An AppImage does not bundle glibc, so it runs
    # on hosts at least as new as the machine that built it; `ubuntu-latest` advancing would
    # silently raise that floor for every user (codex round 2 on #322). The oldest supported
    # runner is the widest compatibility. The tarball is built here too and gets the same benefit.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      # the same pin as ci.yml, for the same reason: a release built with V master would build
      # with a compiler no CI run has tested (codex on #282)
      - name: Set up pinned V (cached)
        uses: ./.github/actions/setup-v
      # same deps as ci.yml's GUI job — the build IS scripts/run_gui.sh, the command devs
      # run, so the release binary is the binary everyone has been testing
      - name: Native deps (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ pkg-config libglfw3-dev libfreetype-dev libgl1-mesa-dev
          # For the AppImage: the runtime .so files it bundles. The -dev packages above provide
          # headers and the linker symlink, not the soname the binary actually loads. No FUSE —
          # build_appimage.sh sets APPIMAGE_EXTRACT_AND_RUN, because libfuse2 is not installable
          # under that name on ubuntu-24.04 runners.
          sudo apt-get install -y --no-install-recommends libglfw3
          # the wheel's build tools live in a venv (scripts/build_wheel.py's `wheel`, auditwheel)
          sudo apt-get install -y --no-install-recommends python3-venv
      - name: Build GUI dependencies (cached)
        uses: ./.github/actions/gui-deps
      - name: Build GUI app
        run: RUN=0 bash scripts/run_gui.sh
      - name: Sanity — the binary answers with the tagged version
        run: |
          got="$(./build/blobly_net --version)"
          [ "$got" = "blobly_net ${GITHUB_REF_NAME#v}" ] || { echo "binary says '$got'"; exit 1; }
      - name: Stage + tar
        run: |
          mkdir -p dist/blobly_net
          sh scripts/stage_bundle.sh dist/blobly_net "${GITHUB_REF_NAME#v}"
          cp build/blobly_net dist/blobly_net/
          # the C ABI (cmd/libblobly) beside the app; its header is in include/
          sh scripts/build_libblobly.sh build
          cp build/libblobly.so dist/blobly_net/
          tar -C dist -czf "blobly_net-${GITHUB_REF_NAME}-linux-x64.tar.gz" blobly_net

      # THE ONE FILE A LINUX USER CAN ACTUALLY RUN (#322). The tarball is dynamically linked, so
      # a user who downloads it and runs ./blobly_net gets "error while loading shared libraries:
      # libglfw.so.3" from the dynamic linker, before main(), with the remedy in a README they had
      # no reason to open. The AppImage carries the libraries instead of asking for them. Both
      # ship: the tarball is still the right thing for anyone who wants the payload unpacked.
      - name: Build the AppImage
        run: sh scripts/build_appimage.sh dist/blobly_net "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-tarball
          path: |
            blobly_net-*.tar.gz
            blobly_net-*.AppImage
          if-no-files-found: error

      # THE LINUX WHEEL, built HERE for the same reason the AppImage is: a wheel's manylinux tag is
      # the newest glibc its library uses, so the oldest runner gives the widest wheel. Its tag is
      # derived from the library (scripts/build_wheel.py) and auditwheel must agree. --release:
      # v.mod's version alone, refused unless it is this tag.
      - name: Build the Linux wheel
        run: |
          python3 -m venv "$RUNNER_TEMP/wheeltools"
          "$RUNNER_TEMP/wheeltools/bin/pip" install -q wheel auditwheel
          "$RUNNER_TEMP/wheeltools/bin/python" scripts/build_wheel.py --release \
            --native build/libblobly.so --out wheels
          "$RUNNER_TEMP/wheeltools/bin/auditwheel" show wheels/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: blobly-wheel-linux
          path: wheels/*.whl
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # the checkout is load-bearing three times over: packaging/RELEASE_HIGHLIGHTS.md and
      # RELEASE_NOTES_HEADER.md are read below, gh resolves the repo from it, and the tag revalidation + previous-tag
      # baseline need the refs — hence full depth with tags. The tarball downloads into the
      # workspace root; its name is untracked, so the two writers cannot collide.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: linux-tarball
      # into a subdirectory named for the app, so the zip below carries ONE top-level folder
      # like the tar does — "Extract All" into Downloads must not scatter an exe, fifteen
      # DLLs and six directories among the user's files
      - uses: actions/download-artifact@v8
        with:
          name: blobly_net-windows-x64
          path: winbundle/blobly_net
      - name: Zip the Windows bundle
        working-directory: winbundle
        run: zip -qr "../blobly_net-${GITHUB_REF_NAME}-windows-x64.zip" blobly_net
      # the two wheels PyPI gets, attached here too, so a release page carries what pip installs
      - uses: actions/download-artifact@v8
        with:
          pattern: blobly-wheel-*
          path: wheels
          merge-multiple: true
      # The Windows build runs for the better part of an hour, and a tag deleted or force
      # -moved in that window must not publish: gh would silently re-create a missing tag
      # from the DEFAULT BRANCH, associating these binaries with source they were not built
      # from. Re-fetch the tag and require its peeled commit to still be the one the guard
      # proved and the jobs built (codex #137 r1) — and --verify-tag below refuses the
      # re-creation path outright.
      - name: The tag still is what the guard proved
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" \
            || { echo "tag ${GITHUB_REF_NAME} is gone from origin — not publishing"; exit 1; }
          now="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          [ "$now" = "$GITHUB_SHA" ] \
            || { echo "tag moved during the build (now $now, built $GITHUB_SHA) — not publishing"; exit 1; }
          # ... and the ANCESTRY too: a main force-pushed during the build to recall this
          # very commit makes the guard's proof stale, and the reviewed-history gate must
          # hold at publication time, not only an hour earlier (codex #137 r4)
          git fetch --force origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "the tagged commit is no longer on origin/main — not publishing"; exit 1; }
      # Notes = the committed header (what the version's claims rest on: CI-verified virtual
      # paths vs hand-verified vendor backends, the no-vendor-DLL rule, the Linux runtime
      # prerequisites) + GitHub's generated changelog. Composed via the API so the two always
      # land in one body, in that order. The changelog BASELINE is the previous v[0-9]* tag,
      # named explicitly: left to the API's automatic choice it baselines on the repository's
      # latest RELEASE, which today is the v-toolchain tooling entry — the first product
      # changelog would then omit every PR merged before that tag (codex #137 r1). No
      # previous product tag = first release, said outright instead of diffed against
      # tooling.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the highest product tag that is an ANCESTOR of this commit — not merely "any
          # other tag": backfilling v0.1.0 after a v0.2.0 exists must not baseline the
          # changelog on the later release (codex #137 r2)
          prev="$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" \
            | while read -r t; do
                git merge-base --is-ancestor "$t" "$GITHUB_SHA" 2>/dev/null || continue
                printf '%s\n' "$t"
                break
              done)"
          # no ancestor tag, but a product tag whose CONTENT is in this history: the history was
          # rewritten after it (an identity rewrite keeps every tree), so the commit carrying the
          # tree of the tag just BELOW this one is the baseline, and the list is the squash-merge
          # subjects since it. Below, not newest: a backfilled older tag must not baseline on a
          # later release, and an older one must not stand in for the one before this.
          base=""
          if [ -z "$prev" ]; then
            below="$(git tag -l 'v[0-9]*' --sort=-v:refname \
              | awk -v cur="$GITHUB_REF_NAME" 'f && !n { print; n = 1 } $0 == cur { f = 1 }')"
            if [ -n "$below" ]; then
              tree="$(git rev-parse "$below^{tree}")"
              base="$(git log --first-parent --format='%H %T' "$GITHUB_SHA" \
                | awk -v t="$tree" '$2 == t && !f { print $1; f = 1 }')"
            fi
          fi
          if [ -n "$prev" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$GITHUB_REF_NAME" -f previous_tag_name="$prev" --jq .body > generated.md
          elif [ -n "$base" ]; then
            printf "## What's Changed since %s\n\n" "$below" > generated.md
            git log --first-parent --format='* %s' "$base..$GITHUB_SHA" >> generated.md
          else
            # a first release still owes the promised PR history — the API cannot express
            # "baseline = the beginning" (it wants a tag, and auto-choice picks the
            # v-toolchain tooling release), so the changelog is built from the merged PRs
            # directly (codex #137 r4)
            # bounded by the TAGGED commit's history, not "merged by publication time": a
            # PR landing during the hour-long build is not in these binaries and must not
            # be advertised by them (codex #137 r5) — hence the ancestry filter per merge
            # commit (PRs merged by other means may carry no mergeCommit; skipped, since
            # nothing proves they are in this history)
            if [ -n "$below" ]; then
              # an earlier tag exists but neither its commit nor its tree is in this history
              printf '## Every PR in this history (no earlier release is in it)\n\n' > generated.md
            else
              printf '## First release — every PR in this history\n\n' > generated.md
            fi
            gh pr list --state merged --base main --limit 1000 \
              --json number,title,mergeCommit \
              --jq '.[] | select(.mergeCommit != null) | "\(.mergeCommit.oid) \(.number) \(.title)"' \
              | while read -r oid num title; do
                  git merge-base --is-ancestor "$oid" "$GITHUB_SHA" 2>/dev/null || continue
                  printf '* %s (#%s)\n' "$title" "$num"
                done >> generated.md
          fi
          # the header's evidence link must survive being a RELEASE body, where relative
          # paths resolve under /releases/tag/ — pin it to the released tag (codex #137 r2)
          sed "s|@TAG@|$GITHUB_REF_NAME|g" packaging/RELEASE_NOTES_HEADER.md > header.md
          # what this release brings first, then every change, then the standing statement
          sed 1d packaging/RELEASE_HIGHLIGHTS.md > highlights.md
          { cat highlights.md; printf '\n'; cat generated.md; printf '\n---\n\n'; cat header.md; } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "Blobly Net $GITHUB_REF_NAME" \
            --verify-tag \
            --notes-file notes.md \
            "blobly_net-${GITHUB_REF_NAME}-linux-x64.tar.gz" \
            "blobly_net-${GITHUB_REF_NAME}-x86_64.AppImage" \
            "blobly_net-${GITHUB_REF_NAME}-windows-x64.zip" \
            wheels/*.whl

  # PyPI, AFTER the GitHub release exists: publish re-proved the tag (it still is the guarded
  # commit, still on main), so nothing reaches PyPI that the release page does not carry. Trusted
  # Publishing — no token: the `pypi` environment and this workflow are what pypi.org trusts
  # (docs/releasing.md says what to set up there). This job holds an OIDC token and nothing else.
  pypi:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/blobly/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # AGAIN, HERE: this job may run long after publish checked — a required reviewer on the
      # environment, or a re-run of a failed upload — so the tag must still name the commit these
      # wheels were built from, and that commit must still be on main, at the moment of upload
      - name: The tag still is what the guard proved
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" \
            || { echo "tag ${GITHUB_REF_NAME} is gone from origin — not publishing"; exit 1; }
          now="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          [ "$now" = "$GITHUB_SHA" ] \
            || { echo "tag moved (now $now, built $GITHUB_SHA) — not publishing"; exit 1; }
          git fetch --force origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "the tagged commit is no longer on origin/main — not publishing"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          pattern: blobly-wheel-*
          path: dist
          merge-multiple: true
      # exactly this tag's two wheels: a local version label (a CI build) or a third file stops it
      - name: The wheels are this tag's
        run: |
          ver="${GITHUB_REF_NAME#v}"
          ls -l dist
          n=$(ls dist/*.whl | wc -l)
          [ "$n" -eq 2 ] || { echo "expected 2 wheels, found $n"; exit 1; }
          for w in dist/*.whl; do
            case "$(basename "$w")" in
              *+*) echo "$w carries a local version label"; exit 1 ;;
            esac
          done
          ls dist/*manylinux*_x86_64.whl dist/*win_amd64.whl >/dev/null
      # A RE-RUN AFTER A PARTIAL UPLOAD must finish the release, so the upload skips a file PyPI
      # already has — but only one that is byte-for-byte this artifact: a file of the same name with
      # another digest stops the job, since PyPI never replaces a published file.
      - name: What PyPI already has of this version is these files
        run: |
          ver="$(basename dist/*manylinux*.whl | cut -d- -f2)"
          code="$(curl -s -o pypi.json -w '%{http_code}' "https://pypi.org/pypi/blobly/${ver}/json")"
          [ "$code" = 404 ] && { echo "nothing of ${ver} on PyPI yet"; exit 0; }
          [ "$code" = 200 ] || { echo "PyPI answered ${code}"; exit 1; }
          for w in dist/*.whl; do
            have="$(python3 -c "import json,sys; d=json.load(open('pypi.json')); print(next((u['digests']['sha256'] for u in d['urls'] if u['filename']==sys.argv[1]), ''))" "$(basename "$w")")"
            [ -z "$have" ] && { echo "$(basename "$w"): not on PyPI yet"; continue; }
            mine="$(sha256sum "$w" | cut -d' ' -f1)"
            [ "$have" = "$mine" ] || { echo "$(basename "$w") is on PyPI with another digest ($have)"; exit 1; }
            echo "$(basename "$w"): already on PyPI, same digest — skipped by the upload"
          done
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true
