# Repository guard: under which identity a commit may land.
#
# Pull requests are open to anyone (fork model — see CONTRIBUTING.md): GitHub holds a fork's
# workflow run until the maintainer approves it, and only the maintainer can merge. What that
# setting does not express is WHO a commit says it is from, so this workflow checks every
# commit's author and committer address and the message body, on the PR before it can merge
# and again on the push that lands it.
#
# The rule is in .githooks/_email_scan.sh (allowed_author / allowed_committer), shared with the
# local hooks so the gates cannot drift apart.
#
# TRUST. On a PR this runs as pull_request_target, NOT pull_request: pull_request checks out
# the proposed merge tree, so the scanner it sources — and the workflow itself — would be the
# contributor's, and a PR could loosen the predicate it is being judged by (codex #326).
# pull_request_target runs the BASE branch's workflow on the BASE branch's checkout; the PR's
# head is fetched as git objects and only its commit METADATA is read — no file of it is ever
# executed, which is what makes pull_request_target safe here. The same property means the
# check does not wait for the maintainer's workflow approval: it is trusted code.
name: guard

on:
  pull_request_target:
    # `edited` too: the PR TITLE is scanned (it becomes the squash subject, see below), and a
    # title can change after the last push.
    types: [opened, synchronize, reopened, edited]
  push:
    # branches only: a v* tag push (release.yml's trigger) points at a commit this guard
    # already scanned when it landed on main — release.yml requires exactly that — so a tag
    # run would full-clone history to scan an empty range and paint a second unrelated
    # status on the release commit.
    branches: ['**']

permissions:
  contents: read

jobs:
  # Every commit must be authored by the maintainer's personal address or a GitHub noreply
  # address. A work address in this history previously had to be rewritten out of all 383
  # commits; this is the guard against a repeat, and the noreply form is how an outside
  # contributor satisfies it without the repo keeping a list of people.
  commit-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scanner self-test
        # The scanner took three review rounds and every round found a BYPASS. Pinning
        # them here means the gate cannot silently regress the next time it is touched.
        run: .githooks/test-email-scan.sh

      - name: Check author and committer emails
        env:
          # Through the environment, never interpolated into the script: a title is
          # contributor-controlled text, and in env it is data, not shell.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          . .githooks/_email_scan.sh
          # ON A PULL REQUEST: exactly the commits the PR would merge. A fork's push never
          # reaches this repository's push event, so without this the first time a fork's
          # author is checked would be the push that lands it on main — a red guard on main,
          # after the fact, with the commit already permanent. The head is fetched as objects
          # into a remote-tracking ref and never checked out (see TRUST above). The range ends
          # at the EVENT's head sha, not at the ref: refs/pull/N/head is mutable, and a run
          # queued behind a second push would otherwise scan the later head and attach that
          # verdict to the earlier revision (codex #326 r4). If the event's head is no longer
          # reachable (force-pushed away), this run fails and the newer event's run judges it.
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            head='${{ github.event.pull_request.head.sha }}'
            git fetch --no-tags origin "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pr/head"
            git cat-file -e "$head^{commit}" 2>/dev/null \
              || { echo "::error::the PR head this run is attached to ($head) is no longer on the PR — superseded by a later push; see that run"; exit 1; }
            range="${{ github.event.pull_request.base.sha }}..$head"
          else
          # The commits this push introduces. On a branch's FIRST push `before` is all-zeroes, and
          # checking only the tip there would be a real hole: a branch pushed with several commits
          # would have every commit but the last go unchecked, and with a merge workflow those
          # reach main having passed a green guard. So fall back to everything not already on the
          # default branch, which is exactly the set under review.
          before='${{ github.event.before }}'
          base="origin/${{ github.event.repository.default_branch }}"
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$before^{commit}" 2>/dev/null; then
            range="$before..${{ github.sha }}"
          elif [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            # The default branch was FORCE-PUSHED and the advertised `before` is gone. The
            # old fallback compared origin/<default> with the new tip — but origin/<default>
            # IS the new tip, so it scanned zero commits and approved the whole rewritten
            # history unseen. That is exactly the scenario this guard exists for, since a
            # rewrite is how an address gets removed (codex #66 r4). Scan everything.
            range='${{ github.sha }}'
          elif git rev-parse --verify --quiet "$base" >/dev/null; then
            range="$base..${{ github.sha }}"          # new branch: all of its own commits
          else
            range='${{ github.sha }}'                 # first push of the default branch itself
          fi
          fi
          echo "checking range: $range"

          bad=0
          while IFS='|' read -r sha ae ce; do
            [ -z "$sha" ] && continue
            # Redacted, like the message scan below: a CI annotation on a public repo is a
            # permanent copy, and a rejected author address is exactly what must not get one.
            allowed_author "$ae" || { echo "::error::$sha author not allowed ($(redact "$ae"))"; bad=1; }
            allowed_committer "$ce" || { echo "::error::$sha committer not allowed ($(redact "$ce"))"; bad=1; }
          done < <(git log --format='%H|%ae|%ce' $range)

          # MESSAGE BODIES, not just identities. The gate above says WHO made the commit; it
          # says nothing about what the message CONTAINS. An address written into a commit
          # message is permanent — it survives branch deletion, `git log` and code search
          # index it, and removing it later costs a rewrite of every branch that carries it
          # (and the PR refs keep it even then, because GitHub will not rewrite those).
          # This repo is public, so a message body is world-readable the moment it lands.
          # Allowlist, deliberately: this catches every foreign address rather than one
          # known-bad string, and naming the offender here would re-leak the very thing a
          # rewrite was needed to remove.
          # The scan itself lives in .githooks/_email_scan.sh so the local hooks and this
          # authoritative gate cannot drift apart. It cuts the `git commit -v` scissors
          # section, then scans the rest (comment lines included, since --cleanup=verbatim
          # keeps them), and matches internationalized domains and domain literals, not
          # just ASCII.
          msg=$(mktemp)
          for sha in $(git log --format='%H' $range); do
            git log -1 --format='%B' "$sha" > "$msg"
            hits=$(scan_message_text "$msg" stored)
            # read line by line: an address with a QUOTED local part can contain spaces,
            # and an unquoted `for` would split it into fragments, each redacted
            # separately and so less redacted than intended (codex #66 r3).
            while IFS= read -r h; do
              [ -z "$h" ] && continue
              # NEVER echo the address itself. A CI annotation is a separate, permanent
              # copy — public on this repo — that rewriting the commit does not remove,
              # so logging it would re-disclose the very value this gate contains
              # (codex #66). The SHA is enough: the author reads the message locally.
              echo "::error::$sha commit message contains a non-allowlisted email address ($(redact "$h")) — inspect it locally with: git log -1 $sha"
              bad=1
            done <<< "$hits"
          done

          # THE SQUASH AUTHOR IS NOT CHECKABLE HERE, so outside PRs are not squash-merged. GitHub
          # authors a squash commit from the PR creator's ACCOUNT identity — even for a one-commit
          # PR — and no API exposes which address that will be before the merge exists (codex
          # #326 r3). "Rebase and merge" preserves the authors this job scanned, so that is the
          # merge method for a PR not opened by the maintainer (CONTRIBUTING.md); the push leg
          # below is the backstop if the wrong button is pressed. The maintainer's own PRs may
          # still be squashed: the account address is the allowed one.
          #
          # THE SQUASH SUBJECT. A squash-merge takes its subject from the PR TITLE when the PR
          # has more than one commit (squash_merge_commit_title = COMMIT_OR_PR_TITLE), so a clean
          # commit range with an address in the title would still land one on main — and the
          # push run would catch it only after it is permanent (codex #326 r2).
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            printf '%s\n' "$PR_TITLE" > "$msg"
            hits=$(scan_message_text "$msg" stored)
            while IFS= read -r h; do
              [ -z "$h" ] && continue
              echo "::error::the PR title contains a non-allowlisted email address ($(redact "$h")) — it becomes the squash commit's subject; edit the title"
              bad=1
            done <<< "$hits"
          fi

          if [ "$bad" -ne 0 ]; then
            echo "Identity:"; explain_identity 2>&1
            echo "Message:  describe the address instead of quoting it (e.g. 'a non-maintainer"
            echo "          work address'), then amend or rebase."
            echo "Install both gates locally with: git config core.hooksPath .githooks"
            exit 1
          fi
          echo "All commit identities and message bodies OK."
