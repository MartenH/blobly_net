name: Build GUI dependencies
description: Cache the pinned ImGui/ImPlot sources, licences and compiled archive per native toolchain.
inputs:
  shell:
    description: Bash on Linux, or the configured MSYS2 shell on Windows.
    default: bash
runs:
  using: composite
  steps:
    # What the archive is compiled against: the C++ compiler (its version names its runtime
    # library too) and the headers of the libraries it includes. NOT the runner image's build
    # number or the whole installed package list — MSYS2 updates on every run and the images
    # weekly, so each was a rebuild of an archive none of those packages touch.
    - name: Identify the native toolchain
      id: environment
      shell: ${{ inputs.shell }}
      run: |
        set -euo pipefail
        key=$({
          printf '%s\n' "${ImageOS:?}"
          g++ --version
          g++ -dumpmachine
          pkg-config --modversion freetype2 glfw3
          pkg-config --cflags freetype2 glfw3
        } | sha256sum | cut -d ' ' -f 1)
        echo "key=$key" >> "$GITHUB_OUTPUT"

    # Keep headers AND licence texts with the archive: compilation and bundle staging need
    # both. No restore-keys: a compiled archive from different inputs is never reusable.
    - name: Restore GUI dependencies
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: |
          libs/vgui/build/cimgui
          libs/vgui/build/cimplot
          libs/vgui/libvgui_c.a
          libs/vgui/libvgui_c.toolchain
        key: gui-deps-1-${{ runner.os }}-${{ runner.arch }}-${{ steps.environment.outputs.key }}-${{ hashFiles('libs/vgui/build_deps.sh', 'libs/vgui/*.cpp', 'libs/vgui/*.h', '.github/actions/gui-deps/action.yml') }}

    - name: Build or validate GUI dependencies
      shell: ${{ inputs.shell }}
      env:
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        if [ "$CACHE_HIT" != true ]; then
          sh libs/vgui/build_deps.sh
        else
          test -s libs/vgui/libvgui_c.a
          # and for the toolchain run_gui.sh will ask about, or every hit would rebuild there
          test "$(cat libs/vgui/libvgui_c.toolchain)" = "$(sh libs/vgui/build_deps.sh --toolchain-id)"
          # An exact content/toolchain match is stronger evidence than mtimes. checkout
          # gives unchanged glue/headers fresh timestamps; make the validated archive newer
          # so run_gui.sh's local freshness check does not rebuild it on every cache hit.
          touch libs/vgui/libvgui_c.a
        fi

    - name: Save GUI dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          libs/vgui/build/cimgui
          libs/vgui/build/cimplot
          libs/vgui/libvgui_c.a
          libs/vgui/libvgui_c.toolchain
        key: ${{ steps.cache.outputs.cache-primary-key }}
